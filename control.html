<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lyrics Presenter</title>
    <style>
        :root {
            --bg-dark: #0b1222;
            --panel: rgba(255, 255, 255, 0.03);
            --accent: #22d3ee;
            --text: #e5e7eb;
            --border: rgba(255, 255, 255, 0.08)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: system-ui, Segoe UI, Roboto;
            background: var(--bg-dark);
            color: var(--text);
        }

        /* Por defecto, no se puede seleccionar texto en la app */
        body,
        button,
        input,
        textarea,
        .panel,
        .preview,
        .tabs,
        .tab,
        .tools,
        .footer-hint,
        #songList,
        #lineByLine {
            user-select: none;
        }

        #tab-editor,
        #tab-editor * {
            user-select: text !important;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border)
        }

        header strong {
            color: var(--accent)
        }

        button,
        input,
        textarea {
            font: inherit;
            border: none;
            outline: none;
            border-radius: 8px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text)
        }

        button:hover {
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer
        }

        .container {
            display: grid;
            grid-template-columns: 280px 1fr 36%;
            gap: 12px;
            padding: 12px
        }

        .panel {
            background: var(--panel);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45)
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px
        }

        .tab {
            padding: 8px 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer
        }

        .tab.active {
            background: linear-gradient(180deg, var(--accent), #38bdf8);
            color: #001b22;
            font-weight: 700
        }

        .preview {
            background: #000;
            border-radius: 12px;
            aspect-ratio: 16/9;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.7)
        }

        .preview .bg {
            position: absolute;
            inset: 0;
            overflow: hidden
        }

        .preview img,
        .preview video {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .preview .overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 6vh
        }

        .preview .text {
            color: #fff;
            text-align: center;
            font-weight: 800;
            text-shadow: 0 0 28px rgba(0, 0, 0, 0.85);
            font-size: 5vh;
            transition: opacity .4s
        }

        #songList div {
            padding: 8px;
            border-bottom: 1px solid var(--border);
            cursor: pointer
        }

        #songList .song-item {
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 2px solid transparent;
            padding: 6px 8px
        }

        #songList .song-item:has(input:checked) {
            background: rgba(37, 99, 235, 0.12);
            border-left-color: rgba(96, 165, 250, 0.7)
        }

        #songList input[type="checkbox"],
        .library-select-all input[type="checkbox"] {
            appearance: none;
            display: block;
            width: 14px !important;
            height: 14px !important;
            min-width: 14px !important;
            max-width: 14px !important;
            min-height: 14px !important;
            max-height: 14px !important;
            flex: 0 0 14px;
            box-sizing: border-box;
            margin: 0;
            border: 1px solid rgba(148, 163, 184, 0.65);
            border-radius: 3px;
            background: rgba(15, 23, 42, 0.35);
            flex: 0 0 auto;
            cursor: pointer;
            position: relative
        }

        #songList input[type="checkbox"]:checked,
        .library-select-all input[type="checkbox"]:checked {
            border-color: #60a5fa;
            background: #2563eb
        }

        #songList input[type="checkbox"]:checked::after,
        .library-select-all input[type="checkbox"]:checked::after {
            content: "";
            position: absolute;
            width: 3px;
            height: 7px;
            left: 4px;
            top: 1px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg)
        }

        .library-select-all {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 8px;
            padding: 5px 0;
            color: #93a4bd;
            font-size: 12px;
            cursor: pointer
        }

        #songList .song-label {
            min-width: 0;
            flex: 1
        }

        #songList div:hover {
            background: rgba(255, 255, 255, 0.02)
        }

        #songList .active {
            background: rgba(34, 211, 238, 0.08)
        }

        #lineByLine div {
            padding: 8px;
            border-bottom: 1px solid var(--border);
            cursor: pointer
        }

        #lineByLine div:hover {
            background: rgba(34, 211, 238, 0.06)
        }

        .tools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px
        }

        #libraryPanel .library-tools {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px
        }

        #libraryPanel .library-tools button {
            min-width: 0;
            padding: 6px 3px;
            font-size: 11px;
            line-height: 1.15;
            white-space: normal
        }

        textarea {
            width: 100%;
            height: 48vh;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
            color: var(--text)
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text)
        }

        .small {
            font-size: 12px;
            opacity: .9
        }

        .footer-hint {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 8px
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px
        }

        /* Vista previa de la proyección */
        #previewText {
            font-size: 3vh;
            line-height: 1.1;
            font-family: inherit;
        }
    </style>
</head>

<body>
    <!-- Encabezado con controles principales -->
    <header>
        <div><strong>Lyrics Presenter</strong> <span class="small">— Panel de Control</span></div>
        <div style="display:flex;gap:8px;align-items:center">
            <select id="displaySelect"></select>
            <button id="btnOpenProj">Abrir proyección</button>
            <button id="btnToggleVis">Oculto (Esc)</button>
            <button id="btnPrev">↑</button>
            <button id="btnNext">↓</button>
        </div>
    </header>
    <!-- Input oculto para importar JSON -->
    <input type="file" id="jsonFileInput" accept=".json" style="display:none">

    <div class="container">
        <!-- Panel de biblioteca de canciones -->
        <section class="panel" id="libraryPanel">
            <h3>Biblioteca</h3>
            <input id="search" placeholder="Buscar canción..." type="text" />
            <label class="library-select-all">
                <input id="selectAllSongs" type="checkbox" />
                <span>Marcar toda la biblioteca</span>
            </label>
            <div id="songList" style="margin-top:8px;max-height:60vh;overflow:auto"></div>
            <div class="tools library-tools" style="margin-top:8px">
                <button id="btnImport">Importar</button>
                <button id="btnExport">Exportar</button>
                <button id="btnClearLib">Vaciar biblioteca</button>
            </div>
            <div class="footer-hint">Un click: cargar en el editor de texto. Doble click: Cargar en el proyector.</div>
        </section>

        <!-- Panel central: editor y proyector (tabs) -->
        <section class="panel">
            <div class="tabs">
                <!-- Poner por defecto la pestaña "Proyector" como activa -->
                <div class="tab" data-tab="editor">Editor de texto</div>
                <div class="tab active" data-tab="lines">Proyector</div>
            </div>

            <!-- Editor de letras: ocultamos por defecto -->
            <div id="tab-editor" class="tabview" style="display:none">
                <h3>Editor §</h3>
                <input id="songTitle" placeholder="Título de la canción..." type="text" />
                <textarea id="editor"
                    placeholder="Escribe la letra aquí. Usa '§' para salto manual de línea."></textarea>
                <div class="tools">
                    <button id="btnSave">Guardar</button>
                    <button id="btnNew">Nuevo</button>
                </div>
            </div>

            <!-- Panel de líneas para proyectar: visible por defecto -->
            <div id="tab-lines" class="tabview" style="display:block">
                <h3>Líneas</h3>
                <div id="lineByLine" style="max-height:60vh;overflow:auto"></div>
                <div class="footer-hint">Haz click en una línea para proyectarla. Doble clic para avanzar/acción rápida.
                </div>
            </div>
        </section>

        <!-- Panel derecho: vista previa de la proyección -->
        <section class="panel">
            <h3>Vista previa</h3>
            <div class="preview" id="preview">
                <div class="bg" id="previewBg"></div>
                <div class="overlay">
                    <div class="text" id="previewText">Sin proyección</div>
                </div>
            </div>

            <div class="tools">
                <input type="file" id="bgFile" accept="image/*,video/*" style="display:none" />
                <button id="btnBg">Fondo</button>
                <button id="btnClearBg">Quitar fondo</button>
                <button id="btnFontInc">+A</button>
                <button id="btnFontDec">-A</button>
                <button id="btnAnimToggle">Animación: OFF</button>
                <button id="btnAnimSpeedDown">- Velocidad</button>
                <button id="btnAnimSpeedUp">+ Velocidad</button>
            </div>
        </section>
    </div>

    <!-- Lógica principal de la app -->
    <script src="control_renderer.js"></script>
</body>

</html>
