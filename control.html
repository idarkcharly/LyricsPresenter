<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lyrics Presenter</title>
    <style>
        :root {
            --bg-dark: #0b1222;
            --panel: rgba(255, 255, 255, 0.03);
            --accent: #22d3ee;
            --text: #e5e7eb;
            --border: rgba(255, 255, 255, 0.08)
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            font-family: system-ui, Segoe UI, Roboto;
            background: var(--bg-dark);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden
        }

        /* Por defecto, no se puede seleccionar texto en la app */
        body,
        button,
        input,
        textarea,
        .panel,
        .preview,
        .tabs,
        .tab,
        .tools,
        .footer-hint,
        #songList,
        #lineByLine {
            user-select: none;
        }

        #tab-editor,
        #tab-editor * {
            user-select: text !important;
        }

        header {
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border)
        }

        header strong {
            color: var(--accent)
        }

        button,
        input,
        textarea {
            font: inherit;
            border: none;
            outline: none;
            border-radius: 8px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text)
        }

        button:hover {
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer
        }

        .container {
            flex: 1 1 auto;
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr) 36%;
            gap: 12px;
            padding: 12px;
            min-height: 0
        }

        .panel {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: var(--panel);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45)
        }

        .panel>h3 {
            flex: 0 0 auto;
            margin: 0 0 10px
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px
        }

        .tab {
            padding: 8px 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer
        }

        .tab.active {
            background: linear-gradient(180deg, var(--accent), #38bdf8);
            color: #001b22;
            font-weight: 700
        }

        .preview {
            background: #000;
            border-radius: 12px;
            aspect-ratio: 16/9;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.7)
        }

        .preview .bg {
            position: absolute;
            inset: 0;
            overflow: hidden
        }

        .preview img,
        .preview video {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .preview .capture {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: none;
            background: #000;
        }

        .preview .overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 6vh
        }

        .preview .text {
            color: #fff;
            text-align: center;
            font-weight: 800;
            text-shadow: 0 0 28px rgba(0, 0, 0, 0.85);
            font-size: 5vh;
            transition: opacity .4s
        }

        #songList {
            flex: 1 1 auto;
            min-height: 0;
            margin-top: 8px;
            overflow: auto
        }

        #songList div {
            padding: 8px;
            border-bottom: 1px solid var(--border);
            cursor: pointer
        }

        #songList .song-item {
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 2px solid transparent;
            padding: 6px 8px
        }

        #songList .song-item:has(input:checked) {
            background: rgba(14, 165, 233, 0.09);
            border-left-color: rgba(34, 211, 238, 0.65)
        }

        #songList input[type="checkbox"],
        .library-select-all input[type="checkbox"] {
            appearance: none;
            display: block;
            width: 16px !important;
            height: 16px !important;
            min-width: 16px !important;
            max-width: 16px !important;
            min-height: 16px !important;
            max-height: 16px !important;
            flex: 0 0 16px;
            aspect-ratio: 1 / 1;
            padding: 0 !important;
            box-sizing: border-box;
            margin: 0;
            border: 1.5px solid rgba(100, 130, 160, 0.4);
            border-radius: 4px !important;
            background: rgba(11, 18, 34, 0.5);
            cursor: pointer;
            position: relative;
            transition: border-color 0.18s, background 0.18s, box-shadow 0.18s
        }

        #songList input[type="checkbox"]:hover,
        .library-select-all input[type="checkbox"]:hover {
            border-color: rgba(34, 211, 238, 0.55);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.08)
        }

        #songList input[type="checkbox"]:checked,
        .library-select-all input[type="checkbox"]:checked {
            border-color: var(--accent);
            background: radial-gradient(circle at 40% 40%, #38bdf8, #0ea5e9);
            box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.18)
        }

        #songList input[type="checkbox"]:checked::after,
        .library-select-all input[type="checkbox"]:checked::after {
            content: "";
            position: absolute;
            width: 4px;
            height: 8px;
            left: 5px;
            top: 2px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg)
        }

        .library-select-all {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 8px;
            padding: 5px 0;
            color: #93a4bd;
            font-size: 12px;
            cursor: pointer
        }

        #songList .song-label {
            min-width: 0;
            flex: 1
        }

        #songList div:hover {
            background: rgba(255, 255, 255, 0.02)
        }

        #songList .active {
            background: rgba(34, 211, 238, 0.08)
        }

        #lineByLine {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto
        }

        #lineByLine div {
            padding: 8px;
            border-bottom: 1px solid var(--border);
            cursor: pointer
        }

        #lineByLine div:hover {
            background: rgba(34, 211, 238, 0.06)
        }

        .tools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px
        }

        #libraryPanel .library-tools {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px
        }

        #libraryPanel .library-tools button {
            min-width: 0;
            padding: 6px 3px;
            font-size: 11px;
            line-height: 1.15;
            white-space: normal
        }

        .tabview {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            min-height: 0
        }

        #songTitle {
            flex: 0 0 auto;
            margin-bottom: 12px
        }

        #tab-editor .editor-tools {
            align-items: center;
            gap: 5px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border)
        }

        #tab-editor .editor-tools button {
            padding: 4px 7px;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.5;
            border-radius: 6px;
            color: #b6c2d4;
            background: rgba(255, 255, 255, 0.04);
            transition: background .15s, color .15s
        }

        #tab-editor .editor-tools button:hover {
            background: rgba(34, 211, 238, 0.14);
            color: var(--accent)
        }

        #tab-editor .editor-tools .btn-icon {
            min-width: 26px;
            padding: 4px 0;
            font-size: 14px;
            font-weight: 700
        }

        #tab-editor .editor-tools .btn-primary {
            background: rgba(34, 211, 238, 0.16);
            color: var(--accent)
        }

        #tab-editor .editor-tools .btn-primary:hover {
            background: rgba(34, 211, 238, 0.26)
        }

        #tab-editor .tools-spacer {
            flex: 1 1 auto
        }

        #tab-editor textarea {
            flex: 1 1 auto;
            height: auto;
            min-height: 120px;
            resize: none
        }

        textarea {
            width: 100%;
            height: 48vh;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 8px;
            color: var(--text)
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text)
        }

        .small {
            font-size: 12px;
            opacity: .9
        }

        .footer-hint {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 8px
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px
        }

        /* Vista previa de la proyección */
        #previewText {
            font-size: 3vh;
            line-height: 1.1;
            font-family: inherit;
        }
    </style>
</head>

<body>
    <!-- Encabezado con controles principales -->
    <header>
        <div><strong>Lyrics Presenter</strong> <span class="small">— Panel de Control</span></div>
        <div style="display:flex;gap:8px;align-items:center">
            <select id="displaySelect"></select>
            <button id="btnOpenProj">Abrir proyección</button>
            <button id="btnToggleVis">Oculto (Esc)</button>
            <button id="btnPrev">↑</button>
            <button id="btnNext">↓</button>
        </div>
    </header>
    <!-- Input oculto para importar JSON -->
    <input type="file" id="jsonFileInput" accept=".json" style="display:none">

    <div class="container">
        <!-- Panel de biblioteca de canciones -->
        <section class="panel" id="libraryPanel">
            <h3>Biblioteca</h3>
            <input id="search" placeholder="Buscar canción..." type="text" spellcheck="false" />
            <label class="library-select-all">
                <input id="selectAllSongs" type="checkbox" />
                <span>Marcar toda la biblioteca</span>
            </label>
            <div id="songList"></div>
            <div class="tools library-tools" style="margin-top:8px">
                <button id="btnImport">Importar</button>
                <button id="btnExport">Exportar</button>
                <button id="btnClearLib">Vaciar biblioteca</button>
            </div>
        </section>

        <!-- Panel central: editor y proyector (tabs) -->
        <section class="panel">
            <div class="tabs">
                <!-- Poner por defecto la pestaña "Proyector" como activa -->
                <div class="tab" data-tab="editor">Editor de texto</div>
                <div class="tab active" data-tab="lines">Proyector</div>
            </div>

            <!-- Editor de letras: ocultamos por defecto -->
            <div id="tab-editor" class="tabview" style="display:none">
                <h3>Editor</h3>
                <input id="songTitle" placeholder="Título de la canción..." type="text" spellcheck="false" />
                <textarea id="editor" spellcheck="false"
                    title="Ctrl+Z para deshacer · Ctrl+Y para rehacer"
                    placeholder="Escribe aquí la letra de la canción..."></textarea>
                <div class="tools editor-tools">
                    <button id="btnUpper" class="btn-icon" title="Convertir la selección o todo el texto a mayúsculas" aria-label="Convertir a mayúsculas">A</button>
                    <button id="btnLower" class="btn-icon" title="Convertir la selección o todo el texto a minúsculas" aria-label="Convertir a minúsculas">a</button>
                    <button id="btnInsertBreak" class="btn-icon" title="Insertar un salto de línea manual (§) en la posición del cursor" aria-label="Insertar salto de línea">§</button>
                    <span class="tools-spacer"></span>
                    <button id="btnSave" class="btn-primary">Guardar</button>
                    <button id="btnNew">Nuevo</button>
                </div>
            </div>

            <!-- Panel de líneas para proyectar: visible por defecto -->
            <div id="tab-lines" class="tabview">
                <h3>Líneas</h3>
                <div id="lineByLine"></div>
            </div>
        </section>

        <!-- Panel derecho: vista previa de la proyección -->
        <section class="panel">
            <h3>Vista previa</h3>
            <div class="preview" id="preview">
                <div class="bg" id="previewBg"></div>
                <div class="overlay">
                    <div class="text" id="previewText">Sin proyección</div>
                </div>
                <video class="capture" id="previewCapture" autoplay muted playsinline></video>
            </div>

            <div class="tools">
                <input type="file" id="bgFile" accept="image/*,video/*" style="display:none" />
                <button id="btnBg">Fondo</button>
                <button id="btnClearBg">Quitar fondo</button>
                <button id="btnFontInc">+A</button>
                <button id="btnFontDec">-A</button>
                <button id="btnAnimToggle">Animación: OFF</button>
                <button id="btnAnimSpeedDown">- Velocidad</button>
                <button id="btnAnimSpeedUp">+ Velocidad</button>
            </div>
        </section>
    </div>

    <!-- Lógica principal de la app -->
    <script src="control_renderer.js"></script>
</body>

</html>
